[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Auditoria de 17/11/2026 (PLANO_CONFIABILIDADE 2.1): todo push redeployava, inclusive commit
# só de docs/STATUS/BACKLOG/testes, e cada deploy apaga o estado em memória do processo
# (pareamento da extensão, fila de captura). Só o que entra na imagem (ver Dockerfile) dispara.
watchPatterns = ["app/**", "global/**", "casas/**", "extensor/**", "Dockerfile", "railway.toml"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# s438 (queda de 25/10/2026): sem healthcheck a Railway mandava o tráfego para o container
# novo ainda travado em "Waiting for application startup". Com ele, o deploy anterior fica
# no ar até o `/healthz` responder, e o `/healthz` só responde depois do `init_db`
# (lifespan). O teto cobre o pior caso do `init_db` (6 × (5 s de lock + 10 s de pausa)).
healthcheckPath = "/healthz"
healthcheckTimeout = 300
