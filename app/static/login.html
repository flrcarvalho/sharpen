<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Se a sessão expirar dentro de um iframe do host (/app), o /login cairia embutido.
     Promove a tela de login para o topo → login sempre em página cheia. -->
<script>
  if (window.self !== window.top) { window.top.location.href = '/login'; }
</script>
<title>Entrar — Sharpen</title>
<meta name="theme-color" content="#0A0D12">
<link rel="icon" type="image/svg+xml" href="/static/favicon/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
<link rel="manifest" href="/static/favicon/site.webmanifest">
<!-- Fontes da marca SELF-HOST (Manrope + JetBrains Mono) — sem dependência do Google Fonts. -->
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/tokens.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  opacity: 0.55; pointer-events: none;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 44px 44px;
}
/* Luz azul da marca iluminando a tela por trás do card */
body::after {
  content: '';
  position: fixed; z-index: 0; pointer-events: none;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 900px; height: 760px; max-width: 130vw;
  background: radial-gradient(ellipse at center, rgba(var(--accent-rgb), .16), transparent 68%);
  filter: blur(24px);
}
.card {
  position: relative; z-index: 1;
  width: 360px; max-width: calc(100vw - 32px);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg, 16px);
  padding: 32px 28px 26px;
  box-shadow: 0 20px 60px rgba(0,0,0,.45), 0 0 90px -24px rgba(var(--accent-rgb), .18);
}
.logo { display: block; width: 200px; margin: 0 auto 18px; }
.logo img { width: 100%; height: auto; display: block; }
.tagline {
  margin-top: 18px; padding-top: 20px;
  border-top: 1px solid var(--line);
  text-align: center;
  font-family: var(--font-sans);
  font-size: 20px; font-weight: 700; letter-spacing: -0.02em;
  color: var(--ink-soft);
}
.tagline .hl { color: var(--accent); }
label {
  display: block; font-size: 11px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-mute); margin: 14px 2px 6px;
}
input {
  width: 100%; padding: 11px 13px;
  background: var(--elevated, var(--surface-2));
  border: 1px solid var(--line);
  border-radius: var(--r-sm, 10px);
  color: var(--ink); font-size: 14px; font-family: inherit;
  transition: border-color .12s;
}
input:focus { outline: none; border-color: var(--accent, #6ea8fe); }
.field { position: relative; }
.field input { padding-right: 44px; }
.olho {
  position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; margin: 0; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; border-radius: var(--r-sm, 10px);
  box-shadow: none; color: var(--ink-mute); cursor: pointer;
  transition: color .12s;
}
.olho:hover { color: var(--ink); filter: none; box-shadow: none; }
.olho svg { width: 18px; height: 18px; display: block; }
.olho .ic-off { display: none; }
.olho.on .ic-on  { display: none; }
.olho.on .ic-off { display: block; }
button {
  width: 100%; margin-top: 22px; padding: 12px;
  background: var(--accent);
  color: #fff;
  border: none; border-radius: var(--r-sm, 10px);
  font-size: 14px; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: filter .12s, box-shadow .12s;
  box-shadow: 0 10px 34px -8px rgba(var(--accent-rgb), .6);
}
button:hover { filter: brightness(1.06); box-shadow: 0 12px 40px -8px rgba(var(--accent-rgb), .78); }
button:disabled { opacity: .6; cursor: default; box-shadow: none; }
.erro {
  margin-top: 14px; min-height: 16px;
  font-size: 12.5px; color: var(--neg); text-align: center;
}
.sucesso {
  margin-top: 14px;
  font-size: 13px; color: var(--accent); text-align: center;
  line-height: 1.5;
}
.alternar {
  display: block; width: 100%; margin-top: 14px; padding: 0;
  background: transparent; border: none; box-shadow: none;
  font-size: 12.5px; font-weight: 600; color: var(--ink-soft);
  text-align: center; cursor: pointer; transition: color .12s;
}
.alternar:hover { color: var(--accent); filter: none; box-shadow: none; }
.social { margin-top: 16px; }
.ou {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; color: var(--ink-mute);
}
.ou::before, .ou::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.btn-social {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  width: 100%; margin-top: 10px; padding: 11px 12px;
  background: transparent; border: 1px solid var(--line);
  border-radius: var(--r-sm, 10px);
  color: var(--ink-soft); font-size: 13.5px; font-weight: 600;
  text-align: center; text-decoration: none;
  transition: border-color .12s, color .12s;
}
/* ⚠️ LOAD-BEARING: o `display` acima (era `block`) VENCE a regra `[hidden]
   {display:none}` do navegador, então o atributo `hidden` do fail-safe não
   escondia nada. O botão do Google ficou visível assim que o Telegram acendeu,
   e `/auth/google` responde 404 sem credencial — clique virava erro cru. O
   container `.social` nunca mostrou o defeito porque não declara `display`.
   Travado em tests/test_login_social.py. */
.btn-social[hidden] { display: none; }
/* Marca de terceiro (Telegram), como os favicons das casas: a cor é da MARCA
   dele, não da nossa paleta — por isso é literal e não token. Não vira
   precedente para cor literal em elemento nosso. */
.btn-social svg { flex: none; width: 18px; height: 18px; }
.btn-social:hover { border-color: var(--accent); color: var(--ink); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="/static/brand-sharpen/blade/lockup-endorsed.svg" alt="Sharpen — by FDC Capital"></div>
    <form id="form">
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" autocomplete="username" autofocus required>
      <label for="senha">Senha</label>
      <div class="field">
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
        <button type="button" class="olho" id="olho" aria-label="Mostrar senha">
          <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <button type="submit" id="btn">Entrar</button>
      <div class="erro" id="erro"></div>
      <div class="sucesso" id="info" hidden></div>
      <button type="button" class="alternar" id="ir-cadastro">Não tem conta? <u>Criar conta</u></button>
    </form>
    <!-- Login social (Fase 3): os botões só aparecem quando /auth/metodos
         confirma que o método está configurado no servidor (fail-safe). -->
    <div class="social" id="social" hidden>
      <div class="ou">ou</div>
      <a class="btn-social" id="btn-google" href="/auth/google" hidden>Entrar com Google</a>
      <a class="btn-social" id="btn-telegram" href="/auth/telegram/ir" hidden><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="12" fill="#2AABEE"/><path fill="#FFFFFF" d="M16.906 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>Entrar com Telegram</a>
    </div>
    <!-- Cadastro (Fase 2 — "aberto com aprovação"): a conta nasce pendente e só
         entra depois que o admin aprovar no /admin. -->
    <form id="form-cadastro" hidden>
      <label for="cad-usuario">Usuário</label>
      <input id="cad-usuario" name="usuario" autocomplete="username" minlength="3" maxlength="24" required>
      <label for="cad-email">E-mail</label>
      <input id="cad-email" name="email" type="email" autocomplete="email" required>
      <label for="cad-senha">Senha</label>
      <div class="field">
        <input id="cad-senha" name="senha" type="password" autocomplete="new-password" minlength="8" required>
        <button type="button" class="olho" id="cad-olho" aria-label="Mostrar senha">
          <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <label for="cad-senha2">Confirmar senha</label>
      <input id="cad-senha2" name="senha2" type="password" autocomplete="new-password" minlength="8" required>
      <button type="submit" id="cad-btn">Criar conta</button>
      <div class="erro" id="cad-erro"></div>
      <div class="sucesso" id="cad-sucesso" hidden></div>
      <button type="button" class="alternar" id="ir-login">Já tem conta? <u>Entrar</u></button>
    </form>
    <div class="tagline">Sharp<span class="hl">en</span> your edge.</div>
  </div>
<script>
const form = document.getElementById('form');
const btn = document.getElementById('btn');
const erro = document.getElementById('erro');

// Mostrar / ocultar senha (olhinho)
const olho = document.getElementById('olho');
const senha = document.getElementById('senha');
olho.addEventListener('click', () => {
  const mostrar = senha.type === 'password';
  senha.type = mostrar ? 'text' : 'password';
  olho.classList.toggle('on', mostrar);
  olho.setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
});

// Botões sociais: fail-safe — só aparecem quando o servidor confirma que o
// método tem credencial configurada (senão a tela fica idêntica à de sempre).
const social = document.getElementById('social');
let temSocial = false;
fetch('/auth/metodos').then(r => r.json()).then(m => {
  document.getElementById('btn-google').hidden = !m.google;
  document.getElementById('btn-telegram').hidden = !m.telegram;
  temSocial = !!(m.google || m.telegram);
  social.hidden = !temSocial || form.hidden;
}).catch(() => {});

// Mensagens do fluxo social (os callbacks voltam por redirect com ?social=…)
const msgSocial = new URLSearchParams(location.search).get('social');
if (msgSocial === 'pendente') {
  const info = document.getElementById('info');
  info.textContent = 'Cadastro recebido! Sua conta está em análise — você poderá entrar assim que for aprovada.';
  info.hidden = false;
} else if (msgSocial === 'suspenso') {
  erro.textContent = 'Conta suspensa. Fale com o administrador.';
} else if (msgSocial === 'erro') {
  erro.textContent = 'Não foi possível entrar com o provedor. Tente novamente.';
}

// Alternância login ⇄ cadastro
const formCadastro = document.getElementById('form-cadastro');
document.getElementById('ir-cadastro').addEventListener('click', () => {
  form.hidden = true;
  social.hidden = true;
  formCadastro.hidden = false;
  document.getElementById('cad-usuario').focus();
});
document.getElementById('ir-login').addEventListener('click', () => {
  formCadastro.hidden = true;
  form.hidden = false;
  social.hidden = !temSocial;
  document.getElementById('usuario').focus();
});

// Deep-link `/login#cadastro` — o CTA da landing pública precisa cair direto no
// cadastro. Sem isto ele largava o visitante no formulário de LOGIN, que é a tela
// errada para quem acabou de decidir criar conta. Reusa o mesmo clique em vez de
// duplicar a lógica de alternância (que também controla os botões sociais).
if (location.hash === '#cadastro') document.getElementById('ir-cadastro').click();

// Olhinho do cadastro
const cadOlho = document.getElementById('cad-olho');
const cadSenha = document.getElementById('cad-senha');
cadOlho.addEventListener('click', () => {
  const mostrar = cadSenha.type === 'password';
  cadSenha.type = mostrar ? 'text' : 'password';
  cadOlho.classList.toggle('on', mostrar);
  cadOlho.setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
});

// Cadastro: conta nasce pendente; a mensagem de sucesso explica a aprovação.
formCadastro.addEventListener('submit', async (e) => {
  e.preventDefault();
  const cadErro = document.getElementById('cad-erro');
  const cadOk = document.getElementById('cad-sucesso');
  const cadBtn = document.getElementById('cad-btn');
  cadErro.textContent = '';
  const senha = cadSenha.value;
  if (senha !== document.getElementById('cad-senha2').value) {
    cadErro.textContent = 'As senhas não conferem.';
    return;
  }
  cadBtn.disabled = true;
  cadBtn.textContent = 'Enviando…';
  try {
    const r = await fetch('/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        usuario: document.getElementById('cad-usuario').value.trim(),
        email: document.getElementById('cad-email').value.trim(),
        senha: senha,
      }),
    });
    const data = await r.json().catch(() => ({}));
    if (r.ok) {
      formCadastro.querySelectorAll('label, .field, input, #cad-btn').forEach(el => { el.hidden = true; });
      cadOk.textContent = data.mensagem || 'Cadastro recebido! Sua conta está em análise.';
      cadOk.hidden = false;
      return;
    }
    cadErro.textContent = data.detail || 'Não foi possível cadastrar. Tente novamente.';
  } catch (_) {
    cadErro.textContent = 'Erro de conexão. Tente novamente.';
  }
  cadBtn.disabled = false;
  cadBtn.textContent = 'Criar conta';
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  erro.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Entrando…';
  try {
    const r = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        usuario: document.getElementById('usuario').value,
        senha: document.getElementById('senha').value,
      }),
    });
    if (r.ok) {
      window.location.href = '/app';
      return;
    }
    const data = await r.json().catch(() => ({}));
    erro.textContent = data.detail || 'Usuário ou senha inválidos.';
  } catch (_) {
    erro.textContent = 'Erro de conexão. Tente novamente.';
  }
  btn.disabled = false;
  btn.textContent = 'Entrar';
});
</script>
</body>
</html>
