<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__NOME__ — Resultados | Sharpen</title>
<meta name="description" content="Resultados públicos e auditáveis do tipster __NOME__, planilhados automaticamente pelo Sharpen.">
<link rel="icon" href="/static/favicon/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font-sans); min-height: 100vh; position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px),
                      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--fdc-steel); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-mute); }
  ::-webkit-scrollbar-track { background: var(--surface); }

  .wrap { max-width: 880px; margin: 0 auto; padding: var(--sp-6) var(--sp-4) var(--sp-8); position: relative; }

  header { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); margin-bottom: var(--sp-6); }
  .brand img { height: 22px; display: block; }
  .atualizado { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-mute); text-align: right; }

  .hero { margin-bottom: var(--sp-6); }
  .hero h1 { font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
  .hero p { color: var(--ink-soft); font-size: 14px; margin-top: var(--sp-1); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--sp-3); margin-bottom: var(--sp-7); }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: var(--sp-4); box-shadow: var(--shadow-card); }
  .kpi .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-mute); margin-bottom: var(--sp-2); }
  .kpi .val { font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: 22px; font-weight: 700; }

  section { margin-bottom: var(--sp-7); }
  section h2 { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-mute); margin-bottom: var(--sp-3); }

  .tscroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-md); box-shadow: var(--shadow-card); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-mute); text-align: left; padding: var(--sp-3) var(--sp-3); border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--line-2); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  th.num, td.num { text-align: right; }
  td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.desc { color: var(--ink-soft); max-width: 340px; }

  .u-val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .u-suf, .u-sign { color: var(--ink-soft); font-size: .78em; }
  .pos { color: var(--pos); }
  .neg { color: var(--neg); }

  .badge { display: inline-block; font-family: var(--font-mono); font-size: 10px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: var(--r-pill);
    border: 1px solid var(--line); color: var(--ink-soft); }
  .badge.W, .badge.HW { color: var(--pos); border-color: rgba(var(--pos-rgb), .35); background: rgba(var(--pos-rgb), .08); }
  .badge.L, .badge.HL { color: var(--neg); border-color: rgba(var(--neg-rgb), .35); background: rgba(var(--neg-rgb), .08); }

  footer { display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
    padding-top: var(--sp-5); border-top: 1px solid var(--line); }
  footer, footer a { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-mute); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  @media (max-width: 560px) {
    .hero h1 { font-size: 22px; }
    .kpi .val { font-size: 18px; }
    td.desc { max-width: 200px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="https://www.sharpen.bet"><img src="/static/brand-sharpen/base/lockup-dark.svg" alt="Sharpen"></a>
    <div class="atualizado" id="atualizado"></div>
  </header>

  <div class="hero">
    <h1 id="nome"></h1>
    <p>Resultados planilhados automaticamente, aposta a aposta. Stake em unidades (u).</p>
  </div>

  <div class="kpis" id="kpis"></div>

  <section>
    <h2>Fechamentos mensais</h2>
    <div class="tscroll">
      <table>
        <thead><tr><th>Mês</th><th class="num">Apostas</th><th class="num">Turnover</th><th class="num">P/L</th><th class="num">ROI</th></tr></thead>
        <tbody id="mensal"></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>Últimas apostas</h2>
    <div class="tscroll">
      <table>
        <thead><tr><th>Data</th><th>Aposta</th><th class="num">Odd</th><th class="num">Stake</th><th>Resultado</th><th class="num">P/L</th></tr></thead>
        <tbody id="ultimas"></tbody>
      </table>
    </div>
  </section>

  <footer>
    <span>Powered by</span> <a href="https://www.sharpen.bet">Sharpen</a>
  </footer>
</div>

<script>
'use strict';
var DADOS = __DADOS__;

// Unidades (u) — contexto próprio desta página (base do tipster é em unidades,
// não R$): espelha o espírito do .money (sufixo neutro menor, cor SÓ no número,
// minus U+2212, zero neutro), sem tocar nas máscaras de R$ do app.
function fmtU(v, comSinal) {
  var pos = v > 1e-9, neg = v < -1e-9;
  var num = Math.abs(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var span = document.createElement('span');
  var val = document.createElement('span');
  val.className = 'u-val' + (comSinal ? (pos ? ' pos' : neg ? ' neg' : '') : '');
  val.textContent = (comSinal ? (pos ? '+' : neg ? '−' : '') : '') + num;
  var suf = document.createElement('span');
  suf.className = 'u-suf';
  suf.textContent = 'u';
  span.appendChild(val); span.appendChild(suf);
  return span;
}

function fmtPct(v, neutro) {
  // `neutro`: winrate é sempre ≥ 0 — cor por sinal ali viraria um "verde eterno"
  // sem significado; cor fica só onde sinal é informação (P/L, ROI).
  var pos = v > 1e-9, neg = v < -1e-9;
  var span = document.createElement('span');
  span.className = 'u-val' + (neutro ? '' : pos ? ' pos' : neg ? ' neg' : '');
  span.textContent = (neg ? '−' : '') +
    Math.abs(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
  return span;
}

function fmtOdd(v) {
  return v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function dataBR(iso) { // "2026-07-31" → "31/07/26"
  var p = iso.split('-');
  return p[2] + '/' + p[1] + '/' + p[0].slice(2);
}

function mesBR(ym) { // "2026-07" → "jul/26"
  var meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  var p = ym.split('-');
  return meses[parseInt(p[1], 10) - 1] + '/' + p[0].slice(2);
}

function td(conteudo, cls) {
  var c = document.createElement('td');
  if (cls) c.className = cls;
  if (conteudo instanceof Node) c.appendChild(conteudo);
  else c.textContent = conteudo;
  return c;
}

// header + hero
document.getElementById('nome').textContent = DADOS.nome;
document.getElementById('atualizado').textContent = 'Atualizado ' + DADOS.atualizado;
document.title = DADOS.nome + ' — Resultados | Sharpen';

// KPIs
(function () {
  var k = DADOS.kpis;
  var defs = [
    ['P/L total', fmtU(k.profit, true)],
    ['ROI', fmtPct(k.roi)],
    ['Winrate', fmtPct(k.winrate, true)],
    ['Apostas', document.createTextNode(k.apostas.toLocaleString('pt-BR'))],
    ['Turnover', fmtU(k.turnover, false)],
  ];
  var box = document.getElementById('kpis');
  defs.forEach(function (d) {
    var card = document.createElement('div'); card.className = 'kpi';
    var lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.textContent = d[0];
    var val = document.createElement('div'); val.className = 'val'; val.appendChild(d[1]);
    card.appendChild(lbl); card.appendChild(val); box.appendChild(card);
  });
})();

// fechamentos mensais
(function () {
  var corpo = document.getElementById('mensal');
  DADOS.mensal.forEach(function (m) {
    var tr = document.createElement('tr');
    tr.appendChild(td(mesBR(m.mes)));
    tr.appendChild(td(m.n.toLocaleString('pt-BR'), 'num'));
    tr.appendChild(td(fmtU(m.turnover, false), 'num'));
    tr.appendChild(td(fmtU(m.profit, true), 'num'));
    tr.appendChild(td(fmtPct(m.roi), 'num'));
    corpo.appendChild(tr);
  });
})();

// últimas apostas
(function () {
  var corpo = document.getElementById('ultimas');
  DADOS.ultimas.forEach(function (a) {
    var tr = document.createElement('tr');
    tr.appendChild(td(dataBR(a.data)));
    tr.appendChild(td(a.desc, 'desc'));
    tr.appendChild(td(fmtOdd(a.odd), 'num'));
    tr.appendChild(td(fmtU(a.stake, false), 'num'));
    var badge = document.createElement('span');
    badge.className = 'badge ' + a.resultado;         // código canônico cru (W/L/V/HW/HL)
    badge.textContent = a.resultado;
    tr.appendChild(td(badge));
    tr.appendChild(td(a.resultado === 'ABERTA' ? '—' : fmtU(a.lucro, true), 'num'));
    corpo.appendChild(tr);
  });
})();
</script>
</body>
</html>
